<!doctype html>
<html lang="zh-CN" data-theme="walnut" data-scheme="dark" data-layout="classic" data-lamp="1">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16110d" />
    <title>纸间笔记 · 微信读书助手</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('weread.appearance')
          if (!raw) return
          var a = JSON.parse(raw)
          var el = document.documentElement
          if (a.theme) el.dataset.theme = a.theme
          if (a.scheme) {
            el.dataset.scheme = a.scheme
            el.style.colorScheme = a.scheme
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:opsz,wght@9..144,500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Karla:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
